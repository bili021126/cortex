<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>计算器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .calculator-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 36px 32px 32px;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 24px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #555;
      margin-bottom: 6px;
    }

    #expression {
      width: 100%;
      padding: 12px 16px;
      font-size: 20px;
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #fafafa;
    }

    #expression:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
      background: #fff;
    }

    #expression::placeholder {
      color: #bbb;
      font-size: 16px;
    }

    #calculateBtn {
      width: 100%;
      padding: 14px 0;
      font-size: 17px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      letter-spacing: 1px;
    }

    #calculateBtn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
    }

    #calculateBtn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .result-section {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #eee;
    }

    .result-label {
      font-size: 13px;
      color: #999;
      margin-bottom: 6px;
    }

    #result {
      min-height: 36px;
      padding: 10px 14px;
      font-size: 22px;
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      background: #f5f5f9;
      border-radius: 8px;
      color: #1a1a2e;
      word-break: break-all;
      transition: background 0.2s;
    }

    #result.error {
      color: #e74c3c;
      background: #fef0ef;
    }

    #result.success {
      color: #27ae60;
      background: #edf9f0;
    }
  </style>
</head>
<body>
  <div class="calculator-card">
    <h1>🧮 计算器</h1>

    <div class="input-group">
      <label for="expression">输入表达式</label>
      <input
        type="text"
        id="expression"
        placeholder="例如：1 + 2 * (3 - 1)"
        autofocus
      />
    </div>

    <button id="calculateBtn">计 算</button>

    <div class="result-section">
      <div class="result-label">结果</div>
      <div id="result">等待输入…</div>
    </div>
  </div>

  <script>
    (function () {
      const expressionInput = document.getElementById("expression");
      const calculateBtn = document.getElementById("calculateBtn");
      const resultEl = document.getElementById("result");

      /**
       * 安全计算数学表达式。
       * 只允许数字、运算符、括号、小数点、空格，用 Function 构造器做一次沙箱。
       */
      function safeEval(expr) {
        const sanitized = expr.replace(/\s/g, "");
        if (!/^[\d+\-*/().%]+$/.test(sanitized)) {
          throw new Error("表达式包含非法字符");
        }

        if (sanitized.length === 0) {
          throw new Error("表达式不能为空");
        }

        const fn = new Function("return (" + sanitized + ")");
        const raw = fn();

        if (typeof raw !== "number" || !isFinite(raw)) {
          throw new Error("计算结果无效");
        }

        return raw;
      }

      function calculate() {
        const expr = expressionInput.value.trim();

        if (!expr) {
          resultEl.textContent = "请输入表达式";
          resultEl.className = "error";
          return;
        }

        try {
          const value = safeEval(expr);
          const formatted =
            Number.isInteger(value) ? value : parseFloat(value.toFixed(10));
          resultEl.textContent = `= ${formatted}`;
          resultEl.className = "success";
        } catch (e) {
          resultEl.textContent = `✗ ${e.message}`;
          resultEl.className = "error";
        }
      }

      calculateBtn.addEventListener("click", calculate);

      expressionInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          calculate();
        }
      });

      expressionInput.addEventListener("input", function () {
        if (resultEl.className === "error") {
          resultEl.textContent = "等待输入…";
          resultEl.className = "";
        }
      });
    })();
  </script>
</body>
</html>
