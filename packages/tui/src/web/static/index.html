<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cortex WebUI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-primary: #1e1e36;
        --bg-secondary: #262640;
        --bg-tertiary: #2e2e4a;
        --text-primary: #ede8f5;
        --text-secondary: #a89cc8;
        --text-muted: #7a6e98;
        --accent: #e8a0bf;
        --accent-glow: #f0c4d8;
        --gold: #e0b870;
        --gold-pulse: #f0d080;
        --success: #7ecb9a;
        --warning: #e0b870;
        --danger: #e07080;
        --border: #363658;
        --font-display: 'Cormorant Garamond', serif;
        --font-body: 'JetBrains Mono', monospace;
        --font-ui: system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: var(--font-body);
        background: var(--bg-primary);
        color: var(--text-primary);
        overflow: hidden;
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: var(--bg-primary); }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #484f58; }
      @keyframes signalPulse {
        0% { box-shadow: inset 3px 0 0 var(--gold-pulse); }
        100% { box-shadow: inset 3px 0 0 transparent; }
      }
      .event-row.pulse { animation: signalPulse 0.6s ease-out; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
